<nav class="main-nav">
  <div class="nav-content">
    <a routerLink="/" class="nav-brand">My Sample App</a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
        <li><a routerLink="/news" routerLinkActive="active">Hacker News</a></li>
      </ul>
      @if (isAuthEnabled) {
        <div class="auth-section">
          @if (isAuthenticated$ | async) {
            <div class="user-info">
              <span class="user-name">{{ (user$ | async)?.name || (user$ | async)?.email }}</span>
              <button class="auth-button logout" (click)="logout()">Logout</button>
            </div>
          } @else {
            <button class="auth-button login" (click)="login()">Login</button>
          }
        </div>
      }
      <div class="theme-selector">
        <button
          class="theme-button"
          (click)="toggleThemeDropdown($event)"
          [attr.aria-expanded]="showThemeDropdown()"
          aria-label="Select theme"
        >
          🎨 {{ currentTheme().name }}
          <span class="dropdown-arrow" [class.open]="showThemeDropdown()">▼</span>
        </button>
        @if (showThemeDropdown()) {
          <div class="theme-dropdown">
            @for (theme of themes; track theme.id) {
              <button
                class="theme-option"
                [class.active]="theme.id === currentTheme().id"
                (click)="selectTheme(theme, $event)"
              >
                <span class="theme-preview" [attr.data-theme]="theme.id"></span>
                {{ theme.name }}
                @if (theme.id === currentTheme().id) {
                  <span class="check-mark">✓</span>
                }
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
